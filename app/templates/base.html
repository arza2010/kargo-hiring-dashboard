<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Kargo Hiring{% endblock %}</title>
<style>
  :root {
    --bg: #f6f7f8;
    --surface: #ffffff;
    --surface-2: #fbfbfc;
    --border: #e7e8ec;
    --border-strong: #d7d9de;
    --ink: #14171a;
    --muted: #6b7280;
    --faint: #9aa1ab;

    --accent: #0d9488;
    --accent-ink: #ffffff;
    --accent-strong: #0f766e;
    --accent-soft: #ecfdf9;
    --accent-soft-border: #b7ece3;

    --warn: #b45309;
    --warn-soft: #fef6e7;
    --warn-soft-border: #f4dfae;

    --bad: #b91c1c;
    --bad-soft: #fdedec;
    --bad-soft-border: #f3c7c4;

    --shadow-sm: 0 1px 2px rgba(20, 23, 26, 0.04);
    --shadow-md: 0 4px 16px rgba(20, 23, 26, 0.06), 0 1px 2px rgba(20, 23, 26, 0.04);
    --shadow-lg: 0 12px 32px rgba(20, 23, 26, 0.10), 0 2px 6px rgba(20, 23, 26, 0.05);
    --radius: 12px;
    --radius-sm: 8px;
    --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d0e;
      --surface: #16191b;
      --surface-2: #1b1f21;
      --border: #262b2e;
      --border-strong: #33393c;
      --ink: #f2f3f4;
      --muted: #9aa3a8;
      --faint: #6b7479;

      --accent: #2dd4bf;
      --accent-ink: #04211d;
      --accent-strong: #5eead4;
      --accent-soft: #102624;
      --accent-soft-border: #1d3d38;

      --warn: #f5b95e;
      --warn-soft: #2a2013;
      --warn-soft-border: #4a3a1e;

      --bad: #f28b82;
      --bad-soft: #2b1717;
      --bad-soft-border: #4a2424;

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.45);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    font-size: 15px;
  }
  a { color: inherit; }

  /* ---------- layout ---------- */
  header.topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -0.01em; font-size: 15px; }
  .brand .mark {
    width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-strong));
    color: var(--accent-ink); font-size: 13px; font-weight: 800; box-shadow: var(--shadow-sm);
  }
  nav.primary-nav { display: flex; gap: 2px; align-items: center; }
  nav.primary-nav a {
    padding: 7px 14px; border-radius: 999px; text-decoration: none; font-size: 13.5px; font-weight: 550;
    color: var(--muted); transition: background .15s, color .15s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  nav.primary-nav a:hover { background: var(--surface-2); color: var(--ink); }
  nav.primary-nav a.active { background: var(--ink); color: var(--surface); }
  .topbar-right { display: flex; align-items: center; gap: 14px; }
  .env-pill {
    font-size: 11.5px; color: var(--faint); border: 1px solid var(--border); padding: 5px 12px 5px 10px;
    border-radius: 999px; letter-spacing: .02em; display: inline-flex; align-items: center; gap: 6px;
  }

  main { max-width: 1140px; margin: 0 auto; padding: 40px 28px 96px; }
  main.narrow { max-width: 760px; }

  h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -0.02em; font-weight: 700; }
  h2 { font-size: 15px; margin: 40px 0 14px; font-weight: 650; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
  h2:first-child { margin-top: 0; }
  .eyebrow { text-transform: uppercase; letter-spacing: .08em; font-size: 11px; font-weight: 700; color: var(--accent); }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 28px; max-width: 640px; }

  /* ---------- cards ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 22px 24px; margin-bottom: 16px; box-shadow: var(--shadow-sm);
  }
  .card.tight { padding: 16px 18px; }
  .card-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 720px) { .grid2, .grid3 { grid-template-columns: 1fr; } main { padding: 24px 16px 72px; } }

  /* ---------- stat tiles ---------- */
  .stat-tile {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 20px; box-shadow: var(--shadow-sm);
  }
  .stat-tile .n { font-size: 28px; font-weight: 750; letter-spacing: -0.02em; line-height: 1.1; }
  .stat-tile .l { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

  /* ---------- buttons ---------- */
  button, .btn, input[type=submit] {
    appearance: none; border: none; cursor: pointer; font-family: inherit;
    font-size: 13.5px; font-weight: 600; padding: 10px 18px; border-radius: 9px;
    display: inline-flex; align-items: center; gap: 6px; transition: transform .08s, box-shadow .15s, background .15s, opacity .15s;
    background: var(--ink); color: var(--surface);
  }
  button:hover, .btn:hover { box-shadow: var(--shadow-md); }
  button:active, .btn:active { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
  button.primary { background: linear-gradient(135deg, var(--accent), var(--accent-strong)); color: var(--accent-ink); }
  button.secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--border-strong); }
  button.danger { background: var(--bad); color: white; }
  button.ghost { background: transparent; color: var(--muted); padding: 8px 10px; }
  button.ghost:hover { background: var(--surface-2); color: var(--ink); }
  button.small { padding: 6px 12px; font-size: 12.5px; }
  form.inline { display: inline; }

  /* ---------- badges ---------- */
  .badge {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px;
    font-size: 11.5px; font-weight: 650; letter-spacing: .01em; white-space: nowrap;
    background: var(--surface-2); color: var(--muted); border: 1px solid var(--border);
  }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .7; }
  .badge.accent { background: var(--accent-soft); color: var(--accent-strong); border-color: var(--accent-soft-border); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn-soft-border); }
  .badge.bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad-soft-border); }

  /* ---------- banners ---------- */
  .banner {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--warn-soft); border: 1px solid var(--warn-soft-border); color: var(--warn);
    padding: 13px 16px; border-radius: var(--radius-sm); margin-bottom: 12px; font-size: 13.5px; font-weight: 500;
  }
  .banner.bad { background: var(--bad-soft); border-color: var(--bad-soft-border); color: var(--bad); }
  .banner .icon { flex: none; margin-top: 1px; }

  /* ---------- tables ---------- */
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 13px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--faint); font-weight: 650; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  tbody tr { transition: background .12s; }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr:last-child td { border-bottom: none; }
  a.rowlink { color: var(--ink); text-decoration: none; font-weight: 650; }
  a.rowlink:hover { color: var(--accent-strong); }

  /* ---------- tabs (segmented) ---------- */
  .tabs {
    display: inline-flex; gap: 2px; padding: 3px; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 10px; margin-bottom: 20px;
  }
  .tabs a {
    padding: 7px 16px; border-radius: 7px; text-decoration: none; color: var(--muted);
    font-size: 13px; font-weight: 600; transition: background .15s, color .15s;
  }
  .tabs a.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }

  /* ---------- forms ---------- */
  label { font-size: 12.5px; font-weight: 600; color: var(--muted); display: block; margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  input[type=text], input[type=email], input[type=file], textarea, select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border-strong); border-radius: 9px;
    font-size: 13.5px; font-family: inherit; background: var(--surface); color: var(--ink);
    transition: border-color .15s, box-shadow .15s;
  }
  input[type=text]:focus, input[type=email]:focus, textarea:focus, select:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  textarea { font-family: inherit; resize: vertical; }
  input[type=checkbox] { accent-color: var(--accent); margin-right: 6px; }

  /* ---------- icons ---------- */
  .icon { flex: none; vertical-align: -4px; }
  nav.primary-nav a, .btn, button, .badge, .banner, h2, .tabs a, .stat-tile .l, .card-row, .empty-state {
    /* icons inherit color + sit on the text baseline wherever they're dropped in */
  }
  .icon-circle {
    width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; flex: none;
    background: var(--accent-soft); color: var(--accent-strong); border: 1px solid var(--accent-soft-border);
  }
  .icon-circle.neutral { background: var(--surface-2); color: var(--muted); border-color: var(--border); }
  .icon-circle.warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn-soft-border); }
  .icon-circle.bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad-soft-border); }

  /* ---------- misc ---------- */
  .avatar {
    width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
    background: var(--surface-2); border: 1px solid var(--border); font-weight: 700; font-size: 12.5px; color: var(--muted);
    flex: none;
  }
  .name-cell { display: flex; align-items: center; gap: 10px; }
  .evidence { color: var(--muted); font-style: italic; font-size: 13px; }
  .unverified { color: var(--bad); font-weight: 650; }
  ul.tight { margin: 6px 0; padding-left: 18px; }
  ul.tight li { margin-bottom: 4px; }
  code, pre { background: var(--surface-2); border-radius: 5px; padding: 1px 6px; font-size: 12.5px; border: 1px solid var(--border); }
  pre { padding: 14px 16px; overflow-x: auto; }
  hr.divider { border: none; border-top: 1px solid var(--border); margin: 28px 0; }
  .muted-link { color: var(--muted); font-size: 13px; text-decoration: none; }
  .muted-link:hover { color: var(--ink); }

  .level-dots { display: inline-flex; gap: 3px; vertical-align: middle; }
  .level-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--border-strong); display: inline-block; }
  .level-dots i.on { background: var(--accent); }

  .score-tile { text-align: center; padding: 22px 18px; }
  .score-tile .ring-value { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; }
  .score-tile .ring-label { font-size: 12px; color: var(--muted); font-weight: 650; text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }
  .score-bar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 10px; border: 1px solid var(--border); }
  .score-bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-strong)); border-radius: 999px; }

  /* ---------- decision picker (segmented radio group) ---------- */
  .decision-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .decision-group input { position: absolute; opacity: 0; pointer-events: none; }
  .decision-group label {
    margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
    padding: 16px 10px; border: 1.5px solid var(--border); border-radius: 10px; cursor: pointer;
    color: var(--muted); font-size: 13px; font-weight: 600; background: var(--surface);
    transition: border-color .15s, background .15s, color .15s;
  }
  .decision-group label:hover { border-color: var(--border-strong); }
  .decision-group input:checked + label {
    border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong);
  }
  .decision-group label .icon-circle { pointer-events: none; }
  @media (max-width: 560px) { .decision-group { grid-template-columns: 1fr; } }

  /* ---------- email preview split ---------- */
  .email-split { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 860px) { .email-split { grid-template-columns: 1fr; } }
  .email-frame {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow-sm); overflow: hidden;
  }
  .email-frame .email-head {
    padding: 14px 18px; border-bottom: 1px solid var(--border); background: var(--surface-2);
    font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 8px;
  }
  .email-frame .email-body { padding: 20px 22px; font-size: 13.5px; }

  /* ---------- bulk upload progress ---------- */
  .progress-track { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--border); }
  .progress-track > span { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent-strong)); transition: width .2s; }
  .upload-log { max-height: 160px; overflow-y: auto; font-size: 12.5px; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
  .upload-log div { display: flex; align-items: center; gap: 6px; padding: 3px 0; color: var(--muted); }
  .upload-log div.ok { color: var(--accent-strong); }
  .upload-log div.err { color: var(--bad); }
</style>
</head>
<body>
{% from "_icons.html" import icon %}
<header class="topbar">
  <div class="brand"><span class="mark">K</span> Kargo Hiring</div>
  <nav class="primary-nav">
    <a href="/setup" class="{% if request.url.path.startswith('/setup') %}active{% endif %}">{{ icon('sliders', 15) }} Setup</a>
    <a href="/dashboard" class="{% if request.url.path.startswith('/dashboard') or request.url.path.startswith('/candidates') %}active{% endif %}">{{ icon('grid', 15) }} Dashboard</a>
  </nav>
  <div class="topbar-right">
    <span class="env-pill">{{ icon('shield-check', 13) }} internal tool &middot; not for candidates</span>
  </div>
</header>
<main{% block main_class %}{% endblock %}>
{% block content %}{% endblock %}
</main>
</body>
</html>
